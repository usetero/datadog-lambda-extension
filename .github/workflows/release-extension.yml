name: Release Lambda Extension

# Versioning tracks DataDog's upstream releases. The upstream version lives in
# the layer NAME (Tero-Datadog-Extension-119), and the AWS layer version integer
# is the patch number. An AWS layer version cannot be set, only appended, so
# putting the upstream number in the name is what keeps it exact — in every
# region, from the first publish, without burning filler versions.
#
#   upstream v119, first release  -> Tero-Datadog-Extension-119:1
#   patch on top of upstream v119 -> Tero-Datadog-Extension-119:2
#
# Tag "v119" to release, "v119.2" to release a patch and assert it lands on 2.
# A tag push is the only automated way in. upstream-release-watch.yml pushes the
# tag; publishing lives here and nowhere else.
on:
  push:
    tags:
      - "v[0-9]+"
      - "v[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream version to release, e.g. 119 or 119.2 (patch optional)"
        required: true
        type: string
      regions:
        description: "Comma-separated AWS regions. Leave empty to use .lambda-layer-regions."
        required: false
        default: ""
        type: string
      architectures:
        description: "Architectures to build and publish"
        required: false
        default: "amd64,arm64"
        type: choice
        options:
          - "amd64"
          - "arm64"
          - "amd64,arm64"
      dry_run:
        description: "Dry run - build but don't publish to AWS"
        required: false
        default: false
        type: boolean
      # Defaults true here so a manual run cannot overwrite a real release by
      # accident. Untick it to publish prod layer names by hand.
      dev:
        description: "Append -dev to the layer name"
        required: false
        default: true
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-22.04
    outputs:
      upstream_version: ${{ steps.version.outputs.upstream_version }}
      patch: ${{ steps.version.outputs.patch }}
      regions: ${{ steps.vars.outputs.regions }}
      regions_json: ${{ steps.vars.outputs.regions_json }}
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
      publish_matrix: ${{ steps.matrix.outputs.publish_matrix }}
    steps:
      - uses: actions/checkout@v4

      # Accepts "119" or "119.2", with or without a leading "v". A missing
      # patch means patch 1; later patches must be explicit so every region and
      # the consumer template resolve to the same immutable layer version.
      - name: Determine version
        id: version
        # Passed through env, not interpolated into the script, so the input
        # cannot inject shell.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          RAW="$INPUT_VERSION"
          if [ -z "$RAW" ]; then
            RAW="${GITHUB_REF#refs/tags/}"
          fi

          if ! PARSED=$(./scripts/parse_release_version.sh "$RAW"); then
            echo "::error::Could not parse version '$RAW'"
            exit 1
          fi
          read -r UPSTREAM PATCH <<< "$PARSED"

          echo "upstream_version=$UPSTREAM" >> "$GITHUB_OUTPUT"
          echo "patch=$PATCH" >> "$GITHUB_OUTPUT"
          echo "Upstream version: $UPSTREAM, patch: ${PATCH:-1}"

      - name: Set variables
        id: vars
        run: |
          REGIONS="${{ inputs.regions }}"
          if [ -z "$REGIONS" ]; then
            REGIONS=$(paste -sd, .lambda-layer-regions)
          fi
          REGIONS_JSON=$(echo "$REGIONS" | jq -c -R 'split(",") | map(gsub("^\\s+|\\s+$";""))')
          echo "regions=$REGIONS" >> $GITHUB_OUTPUT
          echo "regions_json=$REGIONS_JSON" >> $GITHUB_OUTPUT
          echo "Regions: $REGIONS_JSON"

      - name: Build matrices
        id: matrix
        run: |
          ARCHS="${{ inputs.architectures || 'amd64,arm64' }}"
          REGIONS="${{ steps.vars.outputs.regions }}"

          # Build matrix for build job with platform-specific runners
          BUILD_MATRIX='{"include":['
          FIRST=true

          for arch in ${ARCHS//,/ }; do
            if [ "$FIRST" = true ]; then
              FIRST=false
            else
              BUILD_MATRIX="$BUILD_MATRIX,"
            fi
            if [ "$arch" = "amd64" ]; then
              BUILD_MATRIX="$BUILD_MATRIX{\"arch\":\"amd64\",\"runner\":\"ubuntu-24.04\",\"platform\":\"x86_64\"}"
            else
              BUILD_MATRIX="$BUILD_MATRIX{\"arch\":\"arm64\",\"runner\":\"ubuntu-24.04-arm\",\"platform\":\"aarch64\"}"
            fi
          done

          BUILD_MATRIX="$BUILD_MATRIX]}"
          echo "build_matrix=$BUILD_MATRIX" >> $GITHUB_OUTPUT
          echo "Build matrix: $BUILD_MATRIX"

          # Publish matrix: arch x region combinations
          PUBLISH_MATRIX='{"include":['
          FIRST=true

          for region in ${REGIONS//,/ }; do
            region=$(echo "$region" | xargs)  # trim whitespace
            for arch in ${ARCHS//,/ }; do
              if [ "$FIRST" = true ]; then
                FIRST=false
              else
                PUBLISH_MATRIX="$PUBLISH_MATRIX,"
              fi
              PUBLISH_MATRIX="$PUBLISH_MATRIX{\"arch\":\"$arch\",\"region\":\"$region\"}"
            done
          done

          PUBLISH_MATRIX="$PUBLISH_MATRIX]}"
          echo "publish_matrix=$PUBLISH_MATRIX" >> $GITHUB_OUTPUT
          echo "Publish matrix: $PUBLISH_MATRIX"

  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: prepare
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Bottlecap binary
        run: |
          docker buildx build \
            --progress plain \
            --no-cache \
            -t datadog/compile-bottlecap \
            -f ./images/Dockerfile.bottlecap.compile \
            --build-arg PLATFORM=${{ matrix.platform }} \
            --build-arg FIPS=0 \
            --build-arg DEBUG=0 \
            --output type=local,dest=.binaries/compiled-bottlecap-${{ matrix.arch }} \
            .

          mkdir -p .binaries
          cp .binaries/compiled-bottlecap-${{ matrix.arch }}/bottlecap .binaries/bottlecap-${{ matrix.arch }}

      - name: Create Lambda layer zip
        run: |
          mkdir -p .layers/datadog_extension-${{ matrix.arch }}

          # Create extensions directory structure
          mkdir -p .layers/datadog_extension-${{ matrix.arch }}/extensions

          # Copy binary
          cp .binaries/bottlecap-${{ matrix.arch }} .layers/datadog_extension-${{ matrix.arch }}/extensions/datadog-agent
          chmod +x .layers/datadog_extension-${{ matrix.arch }}/extensions/datadog-agent

          # Copy wrapper script
          cp ./scripts/datadog_wrapper .layers/datadog_extension-${{ matrix.arch }}/datadog_wrapper
          chmod +x .layers/datadog_extension-${{ matrix.arch }}/datadog_wrapper

          # Normalize archive metadata so rebuilding the same source produces
          # the same AWS CodeSha256 and a later retry can verify completed cells.
          find .layers/datadog_extension-${{ matrix.arch }} \
            -exec touch -t 198001010000 {} +

          # Create zip
          cd .layers/datadog_extension-${{ matrix.arch }}
          TZ=UTC zip -X -r ../datadog_extension-${{ matrix.arch }}.zip extensions datadog_wrapper
          cd ../..

          # Show size
          echo "Layer size:"
          ls -lh .layers/*.zip

      - name: Upload layer artifact
        uses: actions/upload-artifact@v4
        with:
          name: datadog_extension-${{ matrix.arch }}
          path: .layers/datadog_extension-${{ matrix.arch }}.zip
          retention-days: 30

  publish:
    name: Publish ${{ matrix.arch }} to ${{ matrix.region }}
    runs-on: ubuntu-22.04
    needs: [prepare, build]
    if: ${{ inputs.dry_run != true }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.prepare.outputs.publish_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ matrix.region }}

      - name: Set variables
        id: vars
        run: |
          if [ "${{ matrix.arch }}" == "amd64" ]; then
            ARCH_SUFFIX=""
            COMPATIBLE_ARCH="x86_64"
          else
            ARCH_SUFFIX="-ARM"
            COMPATIBLE_ARCH="arm64"
          fi

          # Driven by an explicit input, not github.event_name: inside a called
          # workflow event_name is the CALLER's event, so keying off it made a
          # manual run of upstream-release-watch publish -dev names while
          # reporting a release. Tag pushes leave the input empty, so they are
          # never -dev.
          if [ "${{ inputs.dev }}" = "true" ]; then
            DEV_SUFFIX="-dev"
          else
            DEV_SUFFIX=""
          fi

          # Layer name: Tero-Datadog-Extension-<upstream>[-ARM][-dev]
          UPSTREAM="${{ needs.prepare.outputs.upstream_version }}"
          LAYER_NAME="Tero-Datadog-Extension-${UPSTREAM}${ARCH_SUFFIX}${DEV_SUFFIX}"

          echo "layer_name=$LAYER_NAME" >> $GITHUB_OUTPUT
          echo "compatible_arch=$COMPATIBLE_ARCH" >> $GITHUB_OUTPUT

      - name: Download layer artifact
        uses: actions/download-artifact@v4
        with:
          name: datadog_extension-${{ matrix.arch }}
          path: .layers

      # A retry verifies and reuses an existing target. Publishing only occurs
      # where the target is genuinely next, so a partial matrix can converge.
      - name: Plan layer publication
        id: version
        run: |
          set -euo pipefail
          LAYER_NAME="${{ steps.vars.outputs.layer_name }}"
          LAYER_FILE=".layers/datadog_extension-${{ matrix.arch }}.zip"
          PATCH="${{ needs.prepare.outputs.patch }}"
          TARGET=${PATCH:-1}
          CODE_SHA256=$(openssl dgst -sha256 -binary "$LAYER_FILE" | openssl base64 -A)

          if EXISTING=$(aws lambda get-layer-version \
              --layer-name "$LAYER_NAME" \
              --version-number "$TARGET" \
              --output json 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version $TARGET already exists; it will be verified and reused."
          elif grep -q 'ResourceNotFoundException' <<< "$EXISTING"; then
            LATEST=$(aws lambda list-layer-versions \
              --layer-name "$LAYER_NAME" \
              --query 'LayerVersions[0].Version' \
              --output text)
            if [ -z "$LATEST" ] || [ "$LATEST" = "None" ]; then
              LATEST=0
            fi
            NEXT=$((LATEST + 1))

            if [ "$TARGET" != "$NEXT" ]; then
              echo "::error::$LAYER_NAME in ${{ matrix.region }} would publish patch $NEXT, but $TARGET is required."
              exit 1
            fi
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Publishing $LAYER_NAME patch $TARGET to ${{ matrix.region }}"
          else
            echo "$EXISTING" >&2
            exit 1
          fi

          echo "version=$TARGET" >> "$GITHUB_OUTPUT"
          echo "code_sha256=$CODE_SHA256" >> "$GITHUB_OUTPUT"

      - name: Publish Lambda layer
        id: publish
        if: steps.version.outputs.exists != 'true'
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          LAYER_NAME="${{ steps.vars.outputs.layer_name }}"
          LAYER_FILE=".layers/datadog_extension-${{ matrix.arch }}.zip"
          COMPATIBLE_ARCH="${{ steps.vars.outputs.compatible_arch }}"
          UPSTREAM="${{ needs.prepare.outputs.upstream_version }}"
          EXPECTED_VERSION="${{ steps.version.outputs.version }}"
          EXPECTED_CODE_SHA256="${{ steps.version.outputs.code_sha256 }}"

          PUBLISH_RESULT=$(aws lambda publish-layer-version \
            --layer-name "$LAYER_NAME" \
            --description "Tero Datadog Lambda Extension (DataDog upstream v${UPSTREAM})" \
            --compatible-architectures "$COMPATIBLE_ARCH" \
            --zip-file "fileb://${LAYER_FILE}" \
            --output json)
          PUBLISHED_VERSION=$(jq -r '.Version' <<< "$PUBLISH_RESULT")
          LAYER_VERSION_ARN=$(jq -r '.LayerVersionArn' <<< "$PUBLISH_RESULT")

          if ! jq -e \
              --arg architecture "$COMPATIBLE_ARCH" \
              --arg code_sha256 "$EXPECTED_CODE_SHA256" \
              --argjson version "$EXPECTED_VERSION" \
              '.Version == $version
                and .Content.CodeSha256 == $code_sha256
                and (.CompatibleArchitectures | index($architecture) != null)' \
              <<< "$PUBLISH_RESULT" >/dev/null; then
            echo "::error::AWS publish response did not match the requested version, artifact, and architecture."
            exit 1
          fi
          echo "Published version $PUBLISHED_VERSION"

          # Make the layer version public
          PERMISSION_RESULT=$(aws lambda add-layer-version-permission \
            --layer-name "$LAYER_NAME" \
            --version-number "$PUBLISHED_VERSION" \
            --statement-id public-access \
            --action lambda:GetLayerVersion \
            --principal "*" \
            --output json)
          PERMISSION_STATEMENT=$(jq -r '.Statement' <<< "$PERMISSION_RESULT")
          if ! jq -e --arg resource "$LAYER_VERSION_ARN" '
              .Effect == "Allow"
              and .Principal == "*"
              and .Action == "lambda:GetLayerVersion"
              and .Resource == $resource
            ' <<< "$PERMISSION_STATEMENT" >/dev/null; then
            echo "::error::AWS did not return the expected public layer permission."
            exit 1
          fi
          echo "Made version $PUBLISHED_VERSION public"

      - name: Verify published layer
        id: verify
        run: |
          set -euo pipefail
          LAYER_NAME="${{ steps.vars.outputs.layer_name }}"
          VERSION="${{ steps.version.outputs.version }}"
          ./scripts/verify_published_layer.sh \
            "${{ matrix.region }}" \
            "$LAYER_NAME" \
            "$VERSION" \
            "${{ steps.vars.outputs.compatible_arch }}" \
            "${{ steps.version.outputs.code_sha256 }}"

          LAYER_ARN=$(aws lambda get-layer-version \
            --layer-name "$LAYER_NAME" \
            --version-number "$VERSION" \
            --query LayerVersionArn \
            --output text)
          echo "published_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "layer_arn=$LAYER_ARN" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "### Published Layer" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Layer Name:** ${{ steps.vars.outputs.layer_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.verify.outputs.published_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** ${{ matrix.region }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Architecture:** ${{ steps.vars.outputs.compatible_arch }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Layer ARN:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.verify.outputs.layer_arn }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  promote-template:
    name: Promote consumer template
    runs-on: ubuntu-22.04
    needs: [prepare, publish]
    if: ${{ needs.publish.result == 'success' && inputs.dry_run != true && inputs.dev != true }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TAG_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify complete production release
        run: |
          PATCH="${{ needs.prepare.outputs.patch }}"
          ./scripts/verify_release_matrix.sh \
            "${{ needs.prepare.outputs.upstream_version }}" \
            "${PATCH:-1}"

      - name: Open template promotion pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
          UPSTREAM_VERSION: ${{ needs.prepare.outputs.upstream_version }}
          RELEASE_PATCH: ${{ needs.prepare.outputs.patch }}
        run: |
          set -euo pipefail
          PATCH=${RELEASE_PATCH:-1}
          BRANCH="chore/promote-layer-v${UPSTREAM_VERSION}.${PATCH}"

          ./scripts/set_serverless_layer_version.sh "$UPSTREAM_VERSION" "$PATCH"
          if git diff --quiet -- serverless.yaml; then
            echo "Consumer template already targets v${UPSTREAM_VERSION}:${PATCH}."
            exit 0
          fi

          if gh pr list --state open --head "$BRANCH" --json number --jq 'length' | grep -qx 1; then
            echo "A template promotion PR for v${UPSTREAM_VERSION}:${PATCH} is already open."
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::error::$BRANCH exists without an open pull request; inspect it before retrying."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add serverless.yaml
          git commit -m "chore: promote Lambda layer v${UPSTREAM_VERSION}.${PATCH}"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: promote Lambda layer v${UPSTREAM_VERSION}.${PATCH}" \
            --body "$(printf '%s\n' \
              "## Overview" \
              "" \
              "Promotes the consumer template after every production layer target" \
              "was verified in every supported region and architecture." \
              "" \
              "## Testing" \
              "" \
              "- Full AWS production layer matrix verified" \
              "- Layer version, architecture, artifact hash, and public policy verified during publishing")"

  release-summary:
    name: Release Summary
    runs-on: ubuntu-22.04
    needs: [prepare, build, publish, promote-template]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|" >> $GITHUB_STEP_SUMMARY
          find artifacts -name "*.zip" -type f | while read f; do
            NAME=$(basename "$f")
            SIZE=$(du -h "$f" | cut -f1)
            echo "| $NAME | $SIZE |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "### Dry Run Mode" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Layers were built but not published to AWS." >> $GITHUB_STEP_SUMMARY
          fi
